{% extends 'web/partials/base.html' %}
{% load static %}
{% block content %}

<link rel="stylesheet" href="{% static 'css/service-page.css' %}">

<!-- Page Header Start -->
<div class="page-header">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <!-- Page Header Box Start -->
                <div class="page-header-box">
                    <h1 class="wow fadeInUp">Our Services</h1>

                    <nav class="wow fadeInUp d-flex align-items-center justify-content-center" data-wow-delay="0.25s">
                        <!-- INSERT_YOUR_CODE -->
                        <form method="get" id="category-dropdown-form" style="display:inline;">
                            <select name="category" id="category-dropdown" class=""
                                style="display:inline-block; width:auto;" onchange="this.form.submit()">
                                <option value="">All Categories</option>

                                {% for category in categories %}
                                <option value="{{ category.id }}" {% if category.id|stringformat:"s" == selected_category %} selected {% endif %}>
                                    {{ category.category }}
                                </option>
                                {% endfor %}
                            </select>
                        </form>
                    </nav>

                </div>
                <!-- Page Header Box End -->
            </div>
        </div>
    </div>
</div>
<!-- Page Header End -->






<section class="services-section">
    <div class="services-wrapper">

        {% for service in services %}
        <div class="service-panel">
            <div class="service-content">
                <h2>{{ service.title }}</h2>

          <a href="{% url 'web:service-single' service.id %}">Detail View</a>

                {% if service.icon %}
                <img src="{{ service.icon.url }}" alt="{{ service.title }}">
                {% endif %}
            </div>
        </div>
        {% empty %}
        <p>No services found for this category.</p>
        {% endfor %}

    </div>
</section>





<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>

<script src="{% static 'js/service-page.js' %}"></script>


{% endblock %}
