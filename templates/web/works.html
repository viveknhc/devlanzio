{% extends 'web/partials/base.html' %}
{% load static %}
{% block content %}

<!-- Page Header Start -->
<div class="page-header">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <!-- Page Header Box Start -->
                <div class="page-header-box">
                    <h1 class="wow fadeInUp">Case Studies</h1>

                    <nav class="wow fadeInUp" data-wow-delay="0.25s">
                        <ol class="breadcrumb">
                            <li class="breadcrumb-item"><a href="index-2.html">home</a></li>
                            <li class="breadcrumb-item active" aria-current="page">Careers</li>
                        </ol>
                    </nav>

                    <div class="filter pt-5 d-flex justify-content-center align-items-center" style="gap: 10px;">
                        <form method="get" id="work-category-dropdown-form" style="display:inline;">
                            <select name="category" id="work-category-dropdown" style="display:inline-block; width:auto;" onchange="this.form.submit()">
                                <option value="">Industries</option>
                                {% for category in categories %}
                                <option value="{{ category.id }}" {% if category.id|stringformat:"s" == selected_category %}selected{% endif %}>
                                    {{ category.category }}
                                </option>
                                {% endfor %}
                            </select>
                        </form>
                    </div>






                </div>
                <!-- Page Header Box End -->
            </div>
        </div>
    </div>
</div>
<!-- Page Header End -->

<!-- Page Portfolio Start -->
<div class="page-portfolio p-0">
    <div class="container">
        <div class="row align-items-center">
            {% for work in works%}
            <div class="col-md-4">
                <!-- Our Work Item Start -->
                <div class="our-work-item">
                    <!-- Work Item Image Start -->
                    <div class="work-item-image">
                        <a href="{% url 'web:work-single' work.id%}" data-cursor-text="View">
                            <figure class="image-anime reveal">
                                <img src="{{ work.image.url }}" alt="">
                            </figure>
                        </a>

                        <!-- Work ReadMore Btn Start -->
                        <div class="work-readmore-btn">
                            <a href="portfolio-single.html"><img src="images/icon-plus.svg" alt=""></a>
                        </div>
                        <!-- Work ReadMore Btn End -->
                    </div>
                    <!-- Work Item Image End -->

                    <!-- Work Item Body Start -->
                    <div class="work-item-body wow fadeInUp">
                        <!-- Work Item Title Start -->
                        <div class="work-item-title">
                            <h3>{{ work.title }}</h3>
                        </div>
                        <!-- Work Item Title End -->

                        <!-- Work Item Tags Start -->
                        <div class="work-item-tags">
                            <ul>
                                <li>{{ work.category }}</li>
                            </ul>
                        </div>
                        <!-- Work Item Tags End -->
                    </div>
                    <!-- Work Item Body End -->

                    <!-- Work Item Content Start -->
                    <div class="work-item-content wow fadeInUp">
                        <p>{{ work.description }}</p>
                    </div>
                    <!-- Work Item Content End -->
                </div>
                <!-- Our Work Item End -->
            </div>
            {% endfor %}


        </div>
    </div>
</div>
<!-- Page Portfolio End -->

{% endblock %}
